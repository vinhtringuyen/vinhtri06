<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách bài tập - Nguyễn Vỉnh Trị</title>

    <style>
        /* --- KHỞI TẠO HỆ THỐNG --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* --- NỀN GRADIENT ĐỘNG + BONG BÓNG BAY --- */
        body {
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientBg 15s ease infinite;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        @keyframes gradientBg {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Các đốm sáng bay lơ lửng tạo hiệu ứng động cho nền */
        body::before, body::after {
            content: "";
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            z-index: 1;
            animation: float 8s ease-in-out infinite;
        }
        body::before { top: -10%; left: -5%; }
        body::after { bottom: -10%; right: -5%; animation-delay: 4s; }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-30px) rotate(10deg); }
        }

        /* --- CONTAINER CHÍNH (GLASSMORPHISM) --- */
        .container {
            width: 100%;
            max-width: 720px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 45px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
            position: relative;
            z-index: 10; /* Nổi lên trên lớp nền */
            animation: scaleUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes scaleUp {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        h1 {
            font-size: 38px;
            font-weight: 800;
            color: #1e293b;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .desc {
            color: #64748b;
            font-size: 16px;
            margin-bottom: 35px;
        }

        /* --- HIỆU ỨNG TỪNG NÚT BÀI TẬP --- */
        .item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-decoration: none;
            color: #334155;
            background: #f8fafc;
            padding: 20px 24px;
            margin-bottom: 18px;
            border-radius: 14px;
            border: 1px solid #e2e8f0;
            font-size: 18px;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            overflow: hidden;
        }

        /* Mũi tên mặc định ẩn bên phải */
        .item::after {
            content: "→";
            font-size: 20px;
            opacity: 0;
            transform: translateX(-10px);
            transition: all 0.3s ease;
            color: #ffffff;
        }

        /* Khi di chuột vào từng bài tập */
        .item:hover {
            color: #ffffff;
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            border-color: transparent;
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(79, 70, 229, 0.3);
        }

        /* Mũi tên xuất hiện và dịch chuyển ra khi hover */
        .item:hover::after {
            opacity: 1;
            transform: translateX(0);
        }

        /* --- FOOTER CHÂN TRANG --- */
        .footer {
            text-align: center;
            margin-top: 40px;
            color: #94a3b8;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            border-top: 1px solid #e2e8f0;
            padding-top: 20px;
        }
    </style>
</head>
