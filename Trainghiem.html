<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trải nghiệm | Nguyễn Vỉnh Trị</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;500;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

    <style>
        :root {
            --accent: #00d2ff;
            --accent-2: #3a7bd5;
            --bg-dark: #050b18;
            --glass: rgba(255, 255, 255, 0.07);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-dark);
            color: #ffffff;
            min-height: 100vh;
            background-image: 
                linear-gradient(to bottom, rgba(5, 11, 24, 0.85), rgba(5, 11, 24, 0.95)),
                url('https://images.unsplash.com/photo-1550751827-4bd374c3f58b?q=80&w=2070'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .main-wrapper { padding: 60px 0; }

        .glass-panel {
            background: var(--glass);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 40px;
            padding: 50px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.6);
        }

        .header-title {
            font-weight: 800;
            font-size: 3.2rem;
            text-transform: uppercase;
            background: linear-gradient(to right, #fff, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        /* KHUNG ẢNH */
        .photo-card {
            position: relative;
            border-radius: 25px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
            aspect-ratio: 16/11;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            background: #000;
        }

        .photo-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.7s ease;
            opacity: 0.9;
        }

        .photo-card:hover {
            transform: translateY(-10px);
            border-color: var(--accent);
            box-shadow: 0 15px 35px rgba(0, 210, 255, 0.3);
        }

        .photo-card:hover img {
            transform: scale(1.1);
            opacity: 0.6;
        }

        .photo-info {
            position: absolute;
            bottom: -100%;
            left: 0;
            width: 100%;
            padding: 25px;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
            transition: all 0.4s ease;
        }

        .photo-card:hover .photo-info { bottom: 0; }

        /* ĐIỀU HƯỚNG CHUẨN */
        .navigation-dock {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 50px;
            padding-top: 30px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .custom-btn {
            padding: 14px 35px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 12px;
        }

        .btn-prev {
            color: #fff;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255,255,255,0.2);
        }

        .btn-next {
            color: #000;
            background: var(--accent);
            border: none;
            box-shadow: 0 10px 20px rgba(0, 210, 255, 0.3);
        }

        .custom-btn:hover {
            transform: translateY(-3px);
            color: #fff;
        }

        .btn-prev:hover { background: rgba(255, 255, 255, 0.15); }
        .btn-next:hover { background: #fff; color: #000; box-shadow: 0 15px 30px rgba(255,255,255,0.2); }

        @media (max-width: 768px) {
            .glass-panel { padding: 30px 20px; }
            .navigation-dock { flex-direction: column; gap: 15px; }
            .custom-btn { width: 100%; justify-content: center; }
        }
    </style>
</head>

<body>

<div class="container main-wrapper">
    <div class="glass-panel animate__animated animate__fadeIn">
        
        <div class="text-center mb-5">
            <h1 class="header-title">Trải Nghiệm</h1>
            <p class="text-white-50 text-uppercase" style="letter-spacing: 2px;">Kỷ niệm & Hoạt động tại TVU</p>
        </div>

        <div class="row g-4">
            <!-- Ảnh 01 -->
            <div class="col-md-6 col-lg-4">
                <div class="photo-card animate__animated animate__fadeInUp" style="animation-delay: 0.1s;">
                    <img src="images/hinh9.jpg" alt="Hoạt động">
                    <div class="photo-info">
                        <span class="badge bg-primary mb-2">CLB Nghiên cứu Khoa học</span>
                        <h6 class="m-0">Tổ chức sự kiện sinh viên</h6>
                    </div>
                </div>
            </div>

            <!-- Ảnh 02 -->
            <div class="col-md-6 col-lg-4">
                <div class="photo-card animate__animated animate__fadeInUp" style="animation-delay: 0.2s;">
                    <img src="images/hinh10.jpg" alt="Hoạt động">
                    <div class="photo-info">
                        <span class="badge bg-primary mb-2">Học tập</span>
                        <h6 class="m-0">Thực hành lập trình C/C++</h6>
                    </div>
                </div>
            </div>

            <!-- Ảnh 03 -->
            <div class="col-md-6 col-lg-4">
                <div class="photo-card animate__animated animate__fadeInUp" style="animation-delay: 0.3s;">
                    <img src="images/hinh3.jpg" alt="Hoạt động">
                    <div class="photo-info">
                        <span class="badge bg-primary mb-2">Ngoại khóa</span>
                        <h6 class="m-0">Tham gia hoạt ngoại khóa nghiên cứu khoa học</h6>
                    </div>
                </div>
            </div>

            <!-- Thêm ảnh khác tương tự ở đây -->
        </div>

        <!-- ĐIỀU HƯỚNG ĐÃ SỬA -->
        <div class="navigation-dock">
            <a href="Gioithieu.html" class="custom-btn btn-prev">
                <i class="fa-solid fa-arrow-left"></i> GIỚI THIỆU
            </a>
            
            <a href="Kinhnghiem.html" class="custom-btn btn-next">
                KINH NGHIỆM <i class="fa-solid fa-arrow-right"></i>
            </a>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
