<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập</title>

    <style>
        body{
            background: white;
            font-family: Times New Roman;
            padding: 20px; /* Thêm padding cho body dễ nhìn hơn */
        }

        /* STYLE NÚT QUAY LẠI DANH SÁCH */
        .wrapper-back-btn {
            width: 100%;
            max-width: 320px; /* Khớp với chiều rộng của form đăng nhập */
            margin: 0 auto 15px auto; /* Căn giữa giống form và cách form một khoảng */
            text-align: left;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 22px;
            background: linear-gradient(135deg, #2563eb, #1e40af);
            color: white;
            text-decoration: none;
            font-family: Arial, sans-serif; /* Đảm bảo font chữ của nút hiện đẹp */
            font-size: 15px;
            font-weight: bold;
            border-radius: 50px;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: linear-gradient(135deg, #1d4ed8, #1e3a8a);
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 6px 18px rgba(37, 99, 235, 0.45);
        }

        .back-btn:active {
            transform: scale(0.98);
        }

        .back-icon {
            font-size: 18px;
        }

        /* Khung xanh ngoài */
        .container{
            width: 320px;
            margin: 0 auto; /* Đổi lại để đi cùng hàng với nút back phía trên */
            background: #ccc;
            border: 15px solid green;
            padding: 20px;
        }

        h1{
            margin-bottom: 30px;
        }

        label{
            font-size: 28px;
        }

        /* Ô nhập */
        input[type="text"],
        input[type="password"]{
            width: 100%;
            height: 35px;
            margin-top: 10px;
            margin-bottom: 10px;
            border: none;
            border-bottom: 3px solid crimson;
            background: white;
            font-size: 18px;
        }

        /* Nút đăng nhập */
        button{
            margin-top: 20px;
            width: 130px;
            height: 50px;
            background: #10b981;
            color: white;
            border: 3px solid #4ade80;
            font-size: 20px;
            cursor: pointer;
        }

        button:hover{
            opacity: 0.9;
        }
    </style>
</head>

<body>

    <div class="wrapper-back-btn">
        <a href="index.html" class="back-btn">
            <span class="back-icon">←</span>
            Quay lại danh sách
        </a>
    </div>

    <div class="container">

        <h1>Đăng nhập</h1>

        <input type="text">

        <p>Tên đăng nhập</p>

        <input type="password">

        <p>Mật khẩu</p>

        <input type="radio" name="gioitinh"> Nam <br>
        <input type="radio" name="gioitinh"> Nữ <br>

        <input type="checkbox"> Lưu giá trị đăng nhập

        <br>

        <button>Đăng nhập</button>

    </div>

</body>
</html>
